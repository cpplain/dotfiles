[mcp_servers.xcode]
command = "xcrun"
args = ["mcpbridge"]
enabled = true
startup_timeout_sec = 90

[ui]
max_thoughts_width = 120
fork_secondary_model = "grok-4.5"
yolo = false
compact_mode = false
permission_mode = "always-approve"
theme = "auto"

[cli]
installer = "internal"

[features]
lsp_tools = true

[plugins]
disabled = ["user/b21d5444/lsp-config"]

[compat.claude]
skills = false
rules = false
agents = false
mcps = false
hooks = false

[marketplace]
default_skills_installs_purged = true
official_marketplace_auto_installed = true
